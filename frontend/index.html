<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>个人个股分析</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function() {
        var base = 1440;
        function setZoom() {
          var w = window.innerWidth;
          document.documentElement.style.zoom = Math.min(w / base, 1.15);
        }
        setZoom();
        window.addEventListener('resize', setZoom);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
